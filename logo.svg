<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64" fill="none">
  <defs>
    <linearGradient id="ppGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003087" />
      <stop offset="100%" stop-color="#0070BA" />
    </linearGradient>
    <linearGradient id="ppGradGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD15C" />
      <stop offset="100%" stop-color="#FFC439" />
    </linearGradient>
    <filter id="shadowBlur" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#003087" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Icon Container with Squircle -->
  <g filter="url(#shadowBlur)">
    <rect x="4" y="8" width="48" height="48" rx="14" fill="url(#ppGradPrimary)" />
    
    <!-- Top Left Split Flow Card (representing splitting out) -->
    <path d="M16 20 C16 16.5 19 15 22 15 L32 15 C34 15 35 17 33.5 18.5 L24 28 C23 29 21.5 29 20 28 L16.5 24.5 C16.2 23.5 16 21.8 16 20 Z" fill="#FFFFFF" fill-opacity="0.25" />
    
    <!-- Bottom Right Split Flow Card (representing settling in) -->
    <path d="M40 44 C40 47.5 37 49 34 49 L24 49 C22 49 21 47 22.5 45.5 L32 36 C33 35 34.5 35 36 36 L39.5 39.5 C39.8 40.5 40 42.2 40 44 Z" fill="url(#ppGradGold)" />

    <!-- Sleek Monogram 'S' with Embedded '$' Slash Line -->
    <!-- S Curve Body -->
    <path d="M33 24.5 C33 22 30.5 20.5 27 20.5 C23 20.5 21 22.5 21 25 C21 28.5 24 29.5 27.5 30.8 C31.5 32 34 33.5 34 37 C34 41 30.5 43.5 26.5 43.5 C22 43.5 19.5 41 19.5 38 L22.8 38 C22.8 39.6 24.2 40.8 26.5 40.8 C29 40.8 30.8 39.5 30.8 37.2 C30.8 34.2 28 33.2 24.5 32 C21 30.8 17.8 29.2 17.8 25.2 C17.8 21.5 21 18 26.8 18 C31.5 18 34.5 20.5 34.8 24.5 L33 24.5 Z" fill="#FFFFFF" font-weight="900" />
    
    <!-- Dollar Slash Stem -->
    <path d="M26.2 15 L28 15 L28 47 L26.2 47 Z" fill="#FFFFFF" fill-opacity="0.85" />
  </g>

  <!-- Typography: SplitSmart -->
  <text x="64" y="37" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5" fill="#003087">
    Split<tspan fill="#0070BA" font-weight="900">Smart</tspan>
  </text>

  <!-- Subtitle Tagline & Badge -->
  <text x="65" y="49" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" letter-spacing="1.2" fill="#52647E" text-transform="uppercase">
    PAYPAL-POWERED SETTLEMENTS
  </text>
  
  <rect x="226" y="24" width="46" height="16" rx="4" fill="#EBF4FC" />
  <text x="249" y="35" text-anchor="middle" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="800" fill="#0070BA">
    FAST S$
  </text>
</svg>
